name: farsha
description: فرشة — إدارة مؤسسات ومحلات الموكيت في السعودية.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.17.2
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/farsha_logo.jpeg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/farsha_logo.jpeg
  adaptive_icon_background: "#F7F3EA"
  adaptive_icon_foreground: assets/images/farsha_logo.jpeg
