name: Build Android Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        run: flutter create --platforms=android --project-name carpet_shop_manager --org sa.carpetshop.manager .
      - name: Install packages
        run: flutter pub get
      - name: Static analysis and tests
        run: |
          flutter analyze
          flutter test
      - name: Build installable release APK
        run: flutter build apk --release
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carpet-shop-manager-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
