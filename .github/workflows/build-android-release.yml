name: Build Android Release APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        run: flutter create --platforms=android --project-name farsha --org sa.farsha.app .
      - name: Install packages
        run: flutter pub get
      - name: Apply Farsha name and launcher icon
        run: |
          sed -i 's/android:label="farsha"/android:label="فرشة"/' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons
      - name: Static analysis and tests
        run: |
          flutter analyze
          flutter test
      - name: Build installable release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farsha-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
