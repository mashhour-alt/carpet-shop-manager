name: Build Android Release APK

on:
  push:
    branches: [main, multi-branch-partners, ui-ux-v2, zatca-financial-snapshot, zatca-ubl-xml]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        run: flutter create --platforms=android --project-name farsha --org sa.farsha.app .
      - name: Install packages
        run: flutter pub get
      - name: Configure Android release app
        run: |
          sed -i 's/android:label="farsha"/android:label="فرشة"/' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in source:
              source = source.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission)
          manifest.write_text(source)
          PY
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          dart run flutter_launcher_icons
      - name: Set up Deno for Stage 2 backend tests
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: UBL backend golden and parity tests
        run: deno test supabase/functions/generate-zatca-ubl/ubl_test.ts
      - name: UBL 2.1 XSD validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils unzip
          mkdir -p build
          deno run --allow-write supabase/functions/generate-zatca-ubl/xsd_fixture.ts
          curl -fsSL https://docs.oasis-open.org/ubl/os-UBL-2.1/UBL-2.1.zip -o /tmp/ubl21.zip
          unzip -q /tmp/ubl21.zip -d /tmp/ubl21
          XSD=$(find /tmp/ubl21 -path '*/xsd/maindoc/UBL-Invoice-2.1.xsd' | head -1)
          test -n "$XSD"
          xmllint --noout --schema "$XSD" build/zatca-stage2-sample.xml
      - name: Static analysis and tests
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build installable release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farsha-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
